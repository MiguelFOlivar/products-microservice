[config]
# Modelo corregido según el requerimiento oficial de los servidores de Google
model = "google_ai_studio/gemini-3.8-flash"
fallback_models = ["google_ai_studio/gemini-3.8-flash"]

[pr_agent]
fallback_user_language = "es"

[pr_reviewer]
publish_output = true
# Desactivamos flujos adicionales que gastan más consultas HTTP para proteger la cuenta gratis
enable_rest_ness = false
enable_security_analysis = false
require_tests_analysis = false

# Forzamos a la IA a empaquetar e inyectar todas las sugerencias críticas dentro del mismo y único comentario
extra_instructions = """
Debido a que estamos operando bajo una cuota diaria muy estricta, debes compactar todo tu análisis en UN SOLO COMENTARIO estructurado:

1. **Resumen Breve**: Explica en un máximo de 3 líneas el objetivo de este Pull Request en el microservicio.
2. **Auditoría Spring Boot 3 & Java 21**: Evalúa si el código cumple estrictamente con:
   - Inyección por constructor (exige @RequiredArgsConstructor de Lombok en lugar de @Autowired en propiedades).
   - Uso de la anotación @Transactional en la capa de servicios.
   - Buenas prácticas de Java moderno (Records para DTOs, Streams).
   - Control centralizado de errores con @ControllerAdvice.
3. **Sugerencias y Correcciones**: Si hay algo que corregir, provee el bloque de código corregido formateado en Markdown listo para copiar y pegar. Máximo 2 recomendaciones críticas.
"""
