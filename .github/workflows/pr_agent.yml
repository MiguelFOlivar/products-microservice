name: PR-Agent Gemini

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  pr_agent_job:
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: write
    name: Run PR-Agent
    steps:
      - name: PR-Agent action step
        uses: the-pr-agent/pr-agent@v0.49.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # Mapeo universal para LiteLLM
          GOOGLE_AI_STUDIO__GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          model: "gemini/gemini-2.5-flash"
          fallback_models: '["gemini/gemini-2.5-flash"]'

          # Solo revisión (1 sola llamada global)
          github_action.auto_review: "true"
          github_action.auto_describe: "false"
          github_action.auto_improve: "false"
