name: PR-Agent Gemini Automático

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  pr_agent_job:
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    # 🚨 SOLUCIÓN AL ERROR 403: Forzamos permisos máximos para que el contenedor pueda leer y escribir comentarios
    permissions:
      issues: write
      pull-requests: write
      contents: write
      statuses: write
    name: Run PR-Agent
    steps:
      - name: PR-Agent action step
        uses: the-pr-agent/pr-agent@v0.49.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOOGLE_AI_STUDIO__GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

          # Usamos el modelo compatible directo de LiteLLM sin sub-rutas complejas
          model: "gemini/gemini-1.5-flash"
          fallback_models: '["gemini/gemini-1.5-flash"]'

          # Una sola llamada optimizada
          github_action.auto_review: "true"
          github_action.auto_describe: "false"
          github_action.auto_improve: "false"
