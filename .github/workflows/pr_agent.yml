name: PR-Agent

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]

permissions:
  issues: write
  pull-requests: write
  contents: write
  statuses: write

jobs:
  pr_agent_job:
    runs-on: ubuntu-latest
    name: Run PR Agent
    if: ${{ github.event.sender.type != 'Bot' }}
    steps:
      - name: PR Agent action
        uses: the-pr-agent/pr-agent@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # CONFIGURACIÓN COMPATIBLE DE MODELO Y CONTROL DE TOKENS (Soluciona el error actual)
          config.model: "gemini/gemini-2.0-flash"
          config.fallback_models: '["gemini/gemini-2.0-flash"]'
          config.custom_model_max_tokens: '{"gemini/gemini-2.0-flash": 1048576}'
          GOOGLE_AI_STUDIO.GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CONFIG.RESPONSE_LANGUAGE: "es-ES"

          # Automatizaciones base
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "false"
          github_action_config.auto_improve: "false"

          # Configuración del Comportamiento de Sugerencias
          PR_CODE_SUGGESTIONS.COMMITTABLE_CODE_SUGGESTIONS: "true"
          PR_CODE_SUGGESTIONS.NUM_CODE_SUGGESTIONS: "3"
          PR_REVIEWER.ENABLE_REVIEW_LABELS_EFFORT: "false"
          PR_REVIEWER.REQUIRE_REVIEWS_TO_PASS: "false"

          # Instrucciones del Mentor de Portafolio (Java 25 + MySQL + Capas)
          PR_REVIEWER.EXTRA_INSTRUCTIONS: |
            Actúa como un Arquitecto de Software Senior y Mentor. Este es un microservicio en desarrollo para un portafolio, estructurado con una Arquitectura en Capas y persistencia en MySQL. Evalúa el código bajo estas reglas estrictas:
            1) Respeto Estricto de Capas: Verifica que el flujo sea unidireccional (Controller -> Service -> Repository). El Controller no debe llamar al Repository ni manejar lógica de negocio. Las Entities de JPA/MySQL jamás deben exponerse en el Controller; para eso se deben usar los 'record' DTOs.
            2) Buenas Prácticas con MySQL y JPA: Revisa que los métodos de escritura en el Service usen '@Transactional' de Spring de forma correcta. Asegura que las relaciones en las entidades (@ManyToOne, @OneToMany) usen 'FetchType.LAZY' para evitar problemas de rendimiento en MySQL, y que no se use '@Data' de Lombok en Entities para evitar bucles infinitos en 'toString' o 'hashCode'.
            3) Java 25 & API Design: Exige controladores REST limpios (códigos HTTP correctos) y centralización de errores en la capa 'exception' mediante '@RestControllerAdvice'. Promueve la inmutabilidad con 'record' para los DTOs y el mapeo manual defensivo.
            4) Inyección de Dependencias: Exige inyección por constructor usando 'final' y '@RequiredArgsConstructor' de Lombok en Services y Controllers.
            Cada sugerencia interactiva debe incluir un bloque de código limpio, ejemplar y didáctico listo para aplicar.
