name: PR-Agent de Qodo (Gemini 3.8 Flash - AUTOMÁTICO RESTRINGIDO)

on:
  pull_request:
    types: [opened, reopened]

jobs:
  pr_agent_job:
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    permissions: write-all # Forzamos permisos totales para evitar el error 403 de integraciones
    name: Run PR-Agent
    steps:
      - name: PR-Agent Action
        uses: docker://pragent/pr-agent:0.49.0-github_action
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOOGLE_AI_STUDIO.GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

          # Configuración básica del modelo
          config.model: "gemini/gemini-3.8-flash"
          config.fallback_models: '["gemini/gemini-3.8-flash"]'

          # Configuración para evitar Timeouts en cuentas Free de Google
          # Desactivamos el "reasoning" extendido pesado que tumba la conexión gratis
          gemini.reasoning_effort: "low"

          # Configuración de llamada única
          GITHUB_ACTION_CONFIG__AUTO_DESCRIBE: "false"
          GITHUB_ACTION_CONFIG__AUTO_REVIEW: "true"
          GITHUB_ACTION_CONFIG__AUTO_IMPROVE: "false"
