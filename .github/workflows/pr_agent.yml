name: PR-Agent de Qodo (Gemini 2.5 Flash - AUTOMÁTICO)

on:
  pull_request:
    types: [opened, reopened, synchronize]
  # Conservamos issue_comment por si en algún momento quieres usar un comando manual adicional
  issue_comment:
    types: [created]

jobs:
  pr_agent_job:
    if: ${{ github.event_issue.pull_request || github.event.pull_request }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: read
    name: Run PR-Agent
    steps:
      - name: PR-Agent Action
        uses: docker://pragent/pr-agent:0.49.0-github_action
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOOGLE_AI_STUDIO__GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

          # Especificación estricta del modelo
          CONFIG__MODEL: "gemini/gemini-2.5-flash"
          CONFIG__FALLBACK_MODELS: '["gemini/gemini-2.5-flash"]'

          # 🔥 ACTIVACIÓN COMPLETAMENTE AUTOMÁTICA
          GITHUB_ACTION_CONFIG__AUTO_DESCRIBE: "true"
          GITHUB_ACTION_CONFIG__AUTO_REVIEW: "true"
          GITHUB_ACTION_CONFIG__AUTO_IMPROVE: "true"
