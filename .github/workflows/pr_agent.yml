name: PR-Agent Gemini Automático (Optimizado Gratis)

on:
  pull_request:
    types: [opened, synchronize] # Solo se ejecuta al abrir el PR o cuando subes nuevos commits

jobs:
  pr_agent_job:
    # Evita que se ejecute si el evento lo generó otro Bot para prevenir bucles recurrentes
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: write
    name: Run PR-Agent
    steps:
      - name: PR-Agent action step
        uses: the-pr-agent/pr-agent@v0.49.0 # Versión fija estable para evitar fallos futuros
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # Sintaxis oficial compatible con las últimas librerías internas de LiteLLM para Google AI Studio
          GOOGLE_AI_STUDIO__GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          model: "google_ai_studio/gemini-3.8-flash"
          fallback_models: '["google_ai_studio/gemini-3.8-flash"]'

          # 🔥 LA OPTIMIZACIÓN: Solo activamos la revisión (1 sola llamada global al abrir)
          github_action.auto_review: "true"
          github_action.auto_describe: "false"
          github_action.auto_improve: "false"
