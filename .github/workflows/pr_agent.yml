name: PR-Agent de Qodo (Gemini 3.8 Flash - AUTOMÁTICO FIJO)

on:
  pull_request:
    types: [opened, reopened] # Solo gasta 1 crédito al abrir el PR. No gasta en commits nuevos

jobs:
  pr_agent_job:
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: write
    name: Run PR-Agent
    steps:
      - name: PR-Agent Action
        uses: docker://pragent/pr-agent:latest # Cambiado a latest para evitar los bugs de timeout
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOOGLE_AI_STUDIO.GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }} # Tu llave de Gemini

          # Configuración limpia del modelo
          config.model: "gemini/gemini-3.8-flash"
          config.fallback_models: '["gemini/gemini-3.8-flash"]'

          # Configuración estricta de una sola llamada
          GITHUB_ACTION_CONFIG__AUTO_DESCRIBE: "false"
          GITHUB_ACTION_CONFIG__AUTO_REVIEW: "true" # Este es el que hace la revisión pesada
          GITHUB_ACTION_CONFIG__AUTO_IMPROVE: "false"
