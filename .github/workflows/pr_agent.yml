name: PR-Agent Gemini Automático

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  pr_agent_job:
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    # 🚨 SOLUCIÓN AL ERROR 403: Forzamos permisos máximos para que el contenedor pueda leer y escribir comentarios
    permissions:
      issues: write
      pull-requests: write
      contents: write
      statuses: write
    name: Run PR-Agent
    steps:
      - name: PR-Agent action step
        uses: the-pr-agent/pr-agent@v0.49.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOOGLE_AI_STUDIO__GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

          # Forzado estricto por variable de entorno (anula el archivo TOML si falla)
          CONFIG__MODEL: "gemini/gemini-2.5-flash"
          CONFIG__FALLBACK_MODELS: '["gemini/gemini-2.5-flash"]'

          # Acciones automáticas unificadas
          GITHUB_ACTION_CONFIG__AUTO_REVIEW: "true"
          GITHUB_ACTION_CONFIG__AUTO_DESCRIBE: "false"
          GITHUB_ACTION_CONFIG__AUTO_IMPROVE: "false"
