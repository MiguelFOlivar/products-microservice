name: PR-Agent Gemini Automático (Optimizado Gratis)

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  pr_agent_job:
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: write
      statuses: write
    name: Run PR-Agent
    steps:
      - name: PR-Agent action step
        uses: the-pr-agent/pr-agent@v0.49.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOOGLE_AI_STUDIO__GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

          # Nomenclatura nativa compatible con los límites internos de MAX_TOKENS del bot
          CONFIG__MODEL: "vertex_ai/gemini-1.5-flash"
          CONFIG__FALLBACK_MODELS: '["vertex_ai/gemini-1.5-flash"]'

          # Modo unificado de bajo consumo
          GITHUB_ACTION_CONFIG__AUTO_REVIEW: "true"
          GITHUB_ACTION_CONFIG__AUTO_DESCRIBE: "false"
          GITHUB_ACTION_CONFIG__AUTO_IMPROVE: "false"
