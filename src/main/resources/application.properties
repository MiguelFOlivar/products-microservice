spring.application.name=products-microservice

# 1. Variables de la Base de Datos con valores por defecto
DB_HOST=localhost
DB_PORT=3306
DB_NAME=db_products

# Credenciales genéricas / por defecto para desarrollo local
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

# 2. URL Dinámica utilizando las variables anteriores
# Metemos los placeholders con sus valores por defecto directamente en la URL
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 3. Optimización común de HikariCP
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000

# 4. Rendimiento JPA
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Perfil activo por defecto (Nuestro entorno local de desarrollo :))
spring.profiles.active=dev
